// ============================================================================
// CS2 / AUTOEXEC                                      SpiRaL
// ============================================================================
// EN: Edit the quoted values in the tables below, or open editor/index.html.
// FR: Modifiez les valeurs entre guillemets, ou ouvrez editor/index.html.
// EN: This is a personal starting profile. Adapt sensitivity, ping and bindings.
// FR: Profil de départ personnel. Adaptez sensibilité, ping et raccourcis.
// EN: Physical keyboard positions support AZERTY/QWERTY; see SCANCODES.md.
// FR: Touches physiques AZERTY/QWERTY ; voir SCANCODES.md.
// Load / Charger : exec autoexec.cfg
// ============================================================================


// @section Mouse & viewmodel | Souris et arme à l’écran
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
viewmodel_offset_x                            "1.0"               // Weapon X offset | Décalage X de l’arme
viewmodel_offset_y                            "2.0"               // Weapon Y offset | Décalage Y de l’arme
viewmodel_offset_z                            "-1.5"              // Weapon Z offset | Décalage Z de l’arme
sensitivity                                   "1.1"               // Mouse sensitivity | Sensibilité de la souris
zoom_sensitivity_ratio                        "1.0"               // Scoped sensitivity multiplier | Multiplicateur de sensibilité avec lunette
r_drawtracers_firstperson                     "1"                 // First-person bullet tracers | Traçantes à la première personne
r_show_build_info                             "0"                 // Show build/version overlay | Afficher la version du jeu

// @section Network | Réseau
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
rate                                          "1000000"           // Max receive bandwidth (bytes/s) | Bande passante reçue maximale (octets/s)
cl_interp_ratio                               "1"                 // Client interpolation ticks | Ticks d’interpolation client
mm_dedicated_search_maxping                   "25"                // Maximum matchmaking ping (ms) | Ping maximal en matchmaking (ms)

// @section Audio | Audio
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
snd_mixahead                                  "0.001"             // Audio buffer (seconds) | Tampon audio (secondes)
snd_mute_losefocus                            "false"             // Mute audio when unfocused | Couper le son hors de la fenêtre
snd_mute_mvp_music_live_players               "true"              // Mute MVP music while players are alive | Couper la musique MVP tant que des joueurs sont vivants
snd_deathcamera_volume                        "0"                 // Death camera volume | Volume de la caméra de mort
snd_mapobjective_volume                       "0.015"             // Objective sound volume (0.015 = 1.5%) | Volume des objectifs (0.015 = 1,5 %)
snd_menumusic_volume                          "0"                 // Menu music volume | Volume de la musique du menu
snd_roundstart_volume                         "0"                 // Round start music volume | Volume de début de manche
snd_roundaction_volume                        "0"                 // Round action music volume | Volume de musique pendant la manche
snd_roundend_volume                           "0"                 // Round end music volume | Volume de fin de manche
snd_tensecondwarning_volume                   "0.015"             // Ten-second warning volume (0.015 = 1.5%) | Volume de l’alerte dix secondes (0.015 = 1,5 %)
snd_mvp_volume                                "0"                 // MVP music volume | Volume de la musique MVP

// @section HUD & assistance | Interface et assistance
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
gameinstructor_enable                         "0"                 // Tutorial instructor | Conseils du tutoriel
cl_autohelp                                   "0"                 // Contextual gameplay hints | Conseils contextuels
safezonex                                     "1"                 // Horizontal HUD safe zone | Zone de sécurité horizontale de l’interface
safezoney                                     "1"                 // Vertical HUD safe zone | Zone de sécurité verticale de l’interface
hud_scaling                                   "0.9"               // HUD scale | Échelle de l’interface
hud_showtargetid                              "1"                 // Target identification | Identification de la cible
cl_hud_color                                  "6"                 // HUD color | Couleur de l’interface
cl_color                                      "4"                 // Lobby color | Couleur dans le salon
cl_teammate_colors_show                       "-1"                // Teammate colors mode | Mode de couleur des coéquipiers
cl_teamid_overhead_mode                       "1"                 // Overhead teammate information | Informations au-dessus des coéquipiers
cl_observed_bot_crosshair                     "2"                 // Bot spectator crosshair mode | Viseur en observation d’un bot
cl_show_observer_crosshair                    "2"                 // Spectator crosshair mode | Viseur en mode spectateur
cl_showloadout                                "1"                 // Always show loadout | Toujours afficher l’équipement

// @section Radar | Radar
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
cl_hud_radar_map_additive                     "1"                 // Additive radar overlay | Superposition additive du radar
cl_hud_radar_blur_background                  "0"                 // Radar background blur | Flou de fond du radar
cl_hud_radar_background_alpha                 "0"                 // Radar background opacity | Opacité du fond du radar
cl_hud_radar_scale                            "1"                 // Radar HUD size | Taille du radar à l’écran
cl_radar_always_centered                      "1"                 // Center radar on player | Centrer le radar sur le joueur
cl_radar_rotate                               "1"                 // Rotate radar with view | Faire pivoter le radar avec la vue
cl_radar_scale                                "0.4"               // Radar map zoom | Zoom de la carte du radar
cl_radar_icon_scale_min                       "0.1"               // Minimum radar icon size | Taille minimale des icônes du radar
cl_radar_scale_dynamic                        "0"                 // Dynamic radar zoom | Zoom dynamique du radar
cl_radar_square_always                        "0"                 // Always square radar | Radar toujours carré

// @section Crosshair | Viseur
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
cl_crosshairstyle                             "4"                 // Crosshair style (4 = static cross) | Style de viseur (4 = croix statique)
cl_crosshair_recoil                           "0"                 // Follow recoil | Suivre le recul
cl_crosshairdot                               "0"                 // Center dot | Point central
cl_crosshairsize                              "1"                 // Crosshair length (legacy control) | Longueur du viseur (commande historique)
cl_crosshairthickness                         "1"                 // Crosshair thickness (legacy control) | Épaisseur du viseur (commande historique)
cl_crosshair_gap                              "0"                 // Crosshair gap | Écartement du viseur
cl_crosshair_drawoutline                      "0"                 // Crosshair outline | Contour du viseur
cl_crosshaircolor_r                           "50"                // Red channel | Composante rouge
cl_crosshaircolor_g                           "250"               // Green channel | Composante verte
cl_crosshaircolor_b                           "50"                // Blue channel | Composante bleue
cl_crosshaircolor_a                           "255"               // Crosshair opacity | Opacité du viseur
cl_crosshair_t                                "0"                 // T-shaped crosshair | Viseur en T

// @section Scope & sniper | Lunette et sniper
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
cl_sniper_delay_unscope                       "0"                 // Unscope delay | Délai de sortie de lunette
cl_sniper_show_inaccuracy                     "0"                 // Scope inaccuracy indicator | Indicateur d’imprécision de la lunette
cl_sniper_auto_rezoom                         "1"                 // Auto re-zoom after shot | Zoom automatique après un tir
cl_crosshair_sniper_width                     "1"                 // Sniper crosshair width | Largeur du viseur de sniper
cl_ironsight_dot_scale                        "1"                 // AUG/SG553 dot scale | Échelle du point AUG/SG553
cl_crosshair_friendly_warning                 "0"                 // Friendly-fire warning | Alerte de tir allié

// @section Grenade crosshair | Viseur de grenade
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
cl_grenadecrosshair_keepusercrosshair         "1"                 // Keep user crosshair visible | Garder le viseur personnel visible
cl_grenadecrosshair_fire                      "0"                 // Incendiary crosshair helper | Aide au viseur pour incendiaire
cl_grenadecrosshairdelay_fire                 "0"                 // Incendiary helper delay (seconds) | Délai de l’aide incendiaire (secondes)
cl_grenadecrosshair_flash                     "0"                 // Flashbang crosshair helper | Aide au viseur pour flash
cl_grenadecrosshairdelay_flash                "0"                 // Flashbang helper delay (seconds) | Délai de l’aide flash (secondes)
cl_grenadecrosshair_decoy                     "0"                 // Decoy crosshair helper | Aide au viseur pour leurre
cl_grenadecrosshairdelay_decoy                "0"                 // Decoy helper delay (seconds) | Délai de l’aide leurre (secondes)
cl_grenadecrosshair_explosive                 "0"                 // HE crosshair helper | Aide au viseur pour grenade HE
cl_grenadecrosshairdelay_explosive            "0"                 // HE helper delay (seconds) | Délai de l’aide HE (secondes)
cl_grenadecrosshair_smoke                     "1"                 // Smoke crosshair helper | Aide au viseur pour fumigène
cl_grenadecrosshairdelay_smoke                "0"                 // Smoke helper delay (seconds) | Délai de l’aide fumigène (secondes)

// @section Spectator camera | Caméra spectateur
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
cl_obs_interp_enable                          "0"                 // Spectator interpolation | Interpolation en mode spectateur
cl_obs_interp_speed                           "2.5"               // Spectator interpolation speed | Vitesse d’interpolation spectateur

// @section Prediction effects | Effets de prédiction
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
cl_predict_body_shot_fx                       "0"                 // Predicted body hit effects | Effets prédits des impacts au corps
cl_predict_head_shot_fx                       "0"                 // Predicted headshot effects | Effets prédits des tirs à la tête
cl_predict_kill_ragdolls                      "0"                 // Predicted kill ragdolls | Corps prédits après élimination
cl_prediction_savedata_postentitypacketreceived "0"                 // Save prediction data | Enregistrer les données de prédiction

// @section Telemetry | Télémétrie
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
cl_hud_telemetry_frametime_show               "2"                 // FPS display (0 off / 1 poor / 2 always) | Affichage FPS (0 non / 1 mauvais / 2 toujours)
cl_hud_telemetry_frametime_poor               "4.2"               // Frametime warning threshold (ms) | Seuil d’alerte du temps d’image (ms)
cl_hud_telemetry_ping_show                    "2"                 // Ping display (0 off / 1 poor / 2 always) | Affichage ping (0 non / 1 mauvais / 2 toujours)
cl_hud_telemetry_ping_poor                    "60"                // Ping warning threshold (ms) | Seuil d’alerte du ping (ms)
cl_hud_telemetry_net_misdelivery_show         "2"                 // Network delivery display mode | Mode d’affichage des pertes réseau
cl_hud_telemetry_net_misdelivery_poor         "0.5"               // Network delivery warning threshold | Seuil d’alerte des pertes réseau

// @section Knife switch | Changement vers le couteau
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
alias "+fastswitch"                           "slot3"             // Select knife on press | Sortir le couteau à l’appui
alias "-fastswitch"                           "lastinv"           // Previous weapon on release | Arme précédente au relâchement
bind scancode6                                "+fastswitch"       // Quick knife switch | Sortir rapidement le couteau

// @section Movement bindings | Touches de déplacement
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
bind scancode26                               "+forward"          // Move forward | Avancer
bind scancode22                               "+back"             // Move backward | Reculer
bind scancode4                                "+left"             // Strafe left | Déplacement à gauche
bind scancode7                                "+right"            // Strafe right | Déplacement à droite
bind scancode44                               "+jump"             // Jump | Sauter
bind scancode224                              "+duck"             // Crouch | S’accroupir
bind scancode225                              "+sprint"           // Walk | Marcher

// @section Mouse & combat bindings | Souris et combat
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
bind MOUSE1                                   "+attack"           // Primary fire | Tir principal
bind MOUSE2                                   "+attack2"          // Secondary fire | Tir secondaire
bind MOUSE4                                   "drop"              // Drop current weapon | Lâcher l’arme
bind MOUSE5                                   "lastinv"           // Switch to previous weapon | Revenir à l’arme précédente
bind MWHEELUP                                 "+jump"             // Jump via mouse wheel up | Sauter avec la molette vers le haut
bind MWHEELDOWN                               "+jump"             // Jump via mouse wheel down | Sauter avec la molette vers le bas

// @section Grenade bindings | Touches de grenade
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
bind scancode20                               "slot7"             // Select flashbang | Sélectionner une flash
bind scancode9                                "slot8"             // Select smoke grenade | Sélectionner un fumigène
bind scancode25                               "slot6"             // Select HE grenade | Sélectionner une grenade HE
bind MOUSE3                                   "slot10"            // Select molotov/incendiary | Sélectionner un molotov/incendiaire

// @section Utility bindings | Touches utilitaires
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
bind scancode8                                "+use"              // Use / interact | Utiliser / interagir
bind scancode21                               "+reload"           // Reload weapon | Recharger
bind scancode5                                "buymenu"           // Open buy menu | Ouvrir le menu d’achat
bind scancode16                               "teammenu"          // Open team selection menu | Ouvrir le choix d’équipe
bind scancode226                              "player_ping"       // Contextual ping | Ping contextuel
bind scancode10                               "+lookatweapon"     // Inspect weapon | Inspecter l’arme
bind scancode27                               "switchhands"       // Switch weapon hand | Changer de main
bind scancode76                               "+spray_menu"       // Open spray menu | Ouvrir le menu des graffitis
bind scancode23                               "+voicerecord"      // Push-to-talk voice chat | Maintenir pour parler
bind scancode28                               "messagemode"       // All text chat | Discussion générale
bind scancode24                               "messagemode2"      // Team text chat | Discussion d’équipe
bind scancode29                               "radio"             // Radio menu | Menu radio
bind scancode100                              "radio1"            // Radio commands (ISO key) | Commandes radio (touche ISO)
bind scancode58                               "autobuy"           // Execute autobuy preset | Achat automatique
bind scancode59                               "rebuy"             // Rebuy last purchase | Racheter l’équipement précédent
bind scancode60                               "vote option1"      // Vote YES | Voter OUI
bind scancode61                               "vote option2"      // Vote NO | Voter NON
bind scancode68                               "exec pracc.cfg"    // Load practice config | Charger la configuration d’entraînement
bind scancode66                               "toggleconsole"     // Toggle developer console | Afficher / masquer la console
bind scancode57                               "toggleradarscale"  // Toggle radar zoom | Basculer le zoom du radar

// @section Finish | Fin
// EN: Optional: type host_writeconfig in the console to save game settings.
// FR: Facultatif : host_writeconfig dans la console pour enregistrer les réglages.
echo "[CS2] autoexec.cfg loaded / charge"
