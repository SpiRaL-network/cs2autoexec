<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>CS2 Profile Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><div class="mark">CS<span>2</span></div><div><b>PROFILE STUDIO</b><small data-t="tagline"></small></div></div>
    <div class="header-right"><span class="offline"><i></i><span data-t="offline"></span></span><select id="language" aria-label="Language"><option value="fr">FR</option><option value="en">EN</option></select><span class="version">3.1</span></div>
  </header>
  <nav class="workflow" aria-label="Workspace">
    <div class="profile-workflow">
      <button id="source-view" class="active"><span class="step-number">1</span><span data-t="sourceStep"></span></button>
      <button id="player-view" disabled><span class="step-number">2</span><span data-t="editStep"></span></button>
      <button id="use-view" disabled><span class="step-number">3</span><span data-t="useStep"></span></button>
    </div>
    <button id="server-view"><span data-t="servers"></span><span aria-hidden="true">↗</span></button>
  </nav>
  <main>
    <section id="source-panel" class="content-page">
      <div class="page-heading"><div><div class="eyebrow" data-t="sourceEyebrow"></div><h1 data-t="welcomeTitle"></h1><p data-t="sourceIntro"></p></div></div>
      <div class="source-grid">
        <div class="card capture-card">
          <div class="card-heading"><span class="card-symbol" aria-hidden="true">↓</span><div><h2 data-t="captureTitle"></h2><p data-t="captureHint"></p></div></div>
          <label class="field" for="account"><span data-t="account"></span><select id="account"></select></label>
          <label class="field" for="installation"><span data-t="installation"></span><select id="installation"></select></label>
          <button id="capture" class="primary full" data-t="capture"></button>
          <div class="quiet-actions"><button id="detect" data-t="detect"></button><button id="choose-steam" data-t="steamFolder"></button></div>
        </div>
        <div class="source-alternatives">
          <div class="card"><div class="card-heading"><span class="card-symbol" aria-hidden="true">↗</span><div><h2 data-t="openTitle"></h2><p data-t="openHint"></p></div></div><button id="import-profile" data-t="openProfile"></button></div>
          <div class="card"><div class="card-heading"><span class="card-symbol" aria-hidden="true">＋</span><div><h2 data-t="manualTitle"></h2><p data-t="manualHint"></p></div></div><button id="import-sources" data-t="importSources"></button></div>
        </div>
      </div>
      <div class="source-footnote"><span class="privacy"><i class="dot"></i><span data-t="privacy"></span></span><span data-t="sourceCoverage"></span></div>
    </section>
    <section id="player-panel" hidden>
      <div id="editor" hidden>
        <div class="profile-heading">
          <div><div class="eyebrow" data-t="eyebrow"></div><h1 id="profile-title"></h1><span id="profile-subtitle" class="micro"></span></div>
          <div class="profile-controls"><span id="dirty" class="pill" hidden data-t="unsaved"></span><button id="profile-options" data-t="profileOptions"></button><button id="save-profile" disabled data-t="save"></button><button id="continue-use" class="primary" data-t="continueUse"></button></div>
        </div>
        <div class="editor-layout">
          <aside class="category-nav"><div class="eyebrow" data-t="settingsHeading"></div><nav id="tabs" aria-label="Settings categories"></nav><div class="profile-summary"><strong id="setting-count">0</strong><span data-t="savedValues"></span><span><b id="source-count">0</b> <span data-t="sourceFiles"></span></span></div><button id="reset" class="quiet" data-t="reset"></button></aside>
          <div class="editor-content">
            <div class="category-heading"><h2 id="category-title"></h2><span id="visible-count" class="micro"></span></div>
            <div class="toolbar"><input id="search" type="search" aria-label="Search"><label><input id="modified-only" type="checkbox"><span data-t="modifiedOnly"></span></label><button id="toggle-details" aria-pressed="false" data-t="details"></button></div>
            <nav id="sections" class="sections" aria-label="Settings sections"></nav>
            <div class="editor-grid"><div class="settings-panel"><div id="rows"></div></div><div class="inspector" hidden><div class="eyebrow" data-t="inspection"></div><h3 id="inspect-title" data-t="selectSetting"></h3><p id="inspect-description" class="micro" data-t="inspectHint"></p><div id="inspect-data"></div><p class="micro" data-t="sourceHint"></p></div></div>
            <details class="source-summary"><summary id="source-summary-label"></summary><div id="source-list"></div><div id="warnings"></div></details>
          </div>
        </div>
      </div>
    </section>
    <section id="use-panel" class="content-page" hidden>
      <div class="page-heading"><div><div class="eyebrow" data-t="useEyebrow"></div><h1 data-t="useTitle"></h1><p id="use-profile" class="profile-context"></p></div><button id="back-edit" data-t="backEdit"></button></div>
      <div class="delivery-grid">
        <div class="card"><div class="card-heading"><span class="card-symbol" aria-hidden="true">↓</span><div><h2 data-t="exportTitle"></h2><p data-t="exportHint"></p></div></div><ul class="bundle-contents"><li><strong>autoexec.cfg</strong><span data-t="bundleAutoexec"></span></li><li><strong>cs2_video.txt</strong><span data-t="bundleVideo"></span></li><li><strong>profile.cs2profile</strong><span data-t="bundleProfile"></span></li></ul><div class="card-actions"><button id="preview" data-t="preview"></button><button id="export" class="primary" data-t="export"></button></div><p class="micro" data-t="scope"></p></div>
        <div class="card"><div class="card-heading"><span class="card-symbol" aria-hidden="true">↳</span><div><h2 data-t="installTitle"></h2><p data-t="installTargetHint"></p></div></div><label class="field" for="target-account"><span data-t="targetAccount"></span><select id="target-account"></select></label><label class="field" for="target-installation"><span data-t="installation"></span><select id="target-installation"></select></label><button id="install-preview" class="primary full" data-t="install"></button><p class="micro" data-t="backupHint"></p><div class="restore-action"><button id="rollback" class="quiet" data-t="rollback"></button></div></div>
      </div>
    </section>
    <section id="server-panel" class="content-page" hidden>
      <div class="page-heading"><div><div class="eyebrow" data-t="serverEyebrow"></div><h1 data-t="serverTitle"></h1><p data-t="serverSubtitle"></p></div><button id="server-export" class="primary" data-t="exportServer"></button></div>
      <div id="server-kinds" class="server-kinds"></div><p id="server-note" class="callout"></p>
      <div class="server-grid"><div class="card"><h2 data-t="serverSettings"></h2><div id="server-rows"></div></div><div class="server-output"><div class="eyebrow" data-t="generatedConfig"></div><pre id="server-code"></pre><p class="micro" data-t="serverLimits"></p><a href="https://github.com/KZGlobalTeam/cs2kz-metamod" data-t="kzLink"></a></div></div>
    </section>
  </main>
  <div id="status" role="status" aria-live="polite"></div>
  <dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="close-modal" aria-label="Close">✕</button></div><div id="modal-content"></div><div class="modal-actions"><button id="cancel-modal" data-t="close"></button><button id="confirm-install" class="primary" hidden data-t="applyInstall"></button></div></dialog>
  <script src="app.js"></script>
</body>
</html>
