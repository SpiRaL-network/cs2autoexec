name: Check CS2 Profile Studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
      - run: node tools/sync-editor.js --check
      - if: runner.os == 'Windows'
        run: npm ci
      - if: runner.os == 'Windows'
        run: npm run test:ui
