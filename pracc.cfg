// ============================================================================
// CS2 / LOCAL PRACTICE                                      SpiRaL
// ============================================================================
// EN: Edit the quoted values in the tables below, or open editor/index.html.
// FR: Modifiez les valeurs entre guillemets, ou ouvrez editor/index.html.
// EN: This is a personal starting profile. Adapt sensitivity, ping and bindings.
// FR: Profil de départ personnel. Adaptez sensibilité, ping et raccourcis.
// EN: Physical keyboard positions support AZERTY/QWERTY; see SCANCODES.md.
// FR: Touches physiques AZERTY/QWERTY ; voir SCANCODES.md.
// Load / Charger : exec pracc.cfg
// ============================================================================
// EN: Load only after opening a local practice map. Requires server control.
// FR: Chargez après avoir ouvert une carte locale. Contrôle du serveur requis.


// @section Local server | Serveur local
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
sv_cheats                                     "1"                 // Enable local cheat commands | Activer les commandes d’entraînement locales

// @section Economy | Économie
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
mp_maxmoney                                   "60000"             // Maximum money | Argent maximal
mp_startmoney                                 "60000"             // Starting money | Argent de départ
mp_buytime                                    "9999"              // Buy time (seconds) | Durée d’achat (secondes)
mp_buy_anywhere                               "1"                 // Buy anywhere | Acheter partout

// @section Teams | Équipes
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
mp_limitteams                                 "0"                 // Team size limit | Limite de taille des équipes
mp_autoteambalance                            "0"                 // Auto team balancing | Équilibrage automatique des équipes

// @section Rounds | Manches
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
mp_freezetime                                 "0"                 // Freeze time (seconds) | Temps de préparation (secondes)
mp_roundtime                                  "60"                // Round duration (minutes) | Durée de manche (minutes)
mp_roundtime_defuse                           "60"                // Defuse round duration (minutes) | Durée de manche désamorçage (minutes)

// @section Respawn | Réapparition
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
mp_respawn_on_death_ct                        "1"                 // Respawn CT players | Réapparition des CT
mp_respawn_on_death_t                         "1"                 // Respawn T players | Réapparition des T

// @section Bots | Bots
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
bot_freeze                                    "1"                 // Freeze bots | Figer les bots
bot_dont_shoot                                "1"                 // Prevent bots from shooting | Empêcher les bots de tirer
bot_stop                                      "1"                 // Stop bot movement | Arrêter le déplacement des bots

// @section Ammunition | Munitions
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
sv_infinite_ammo                              "1"                 // Infinite ammo (1 = no reload, 2 = reload) | Munitions infinies (1 sans rechargement, 2 avec)
ammo_grenade_limit_total                      "5"                 // Maximum carried grenades | Nombre maximal de grenades

// @section Grenade visuals | Visualisation des grenades
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
sv_grenade_trajectory_prac_trailtime          "8"                 // Trajectory trail duration (seconds) | Durée de la trajectoire (secondes)
sv_grenade_trajectory_prac_pipreview          "1"                 // Grenade trajectory preview | Aperçu de trajectoire des grenades

// @section Bullet impacts | Impacts de balle
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
sv_showimpacts                                "1"                 // Show bullet impacts | Afficher les impacts de balle
sv_showimpacts_time                           "10"                // Impact duration (seconds) | Durée des impacts (secondes)

// @section Movement training | Entraînement au déplacement
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
sv_enablebunnyhopping                         "1"                 // Allow bunnyhopping | Autoriser le bunnyhop
sv_autobunnyhopping                           "1"                 // Automatic bunnyhopping | Bunnyhop automatique

// @section Practice bindings | Touches d’entraînement
// Command / Commande                          Value / Valeur     Description / Description
// ---------------------------------------------------------------------------
bind scancode62                               "noclip"            // Toggle noclip | Basculer le vol libre
bind scancode63                               "sv_rethrow_last_grenade" // Rethrow last grenade | Relancer la dernière grenade
bind scancode64                               "bot_add;bot_place" // Place a bot at crosshair | Placer un bot sous le viseur

// @section Apply to local server | Appliquer au serveur local
bot_kick
mp_warmup_end
god "1" // Enable invulnerability (not a toggle) | Activer l’invulnérabilité
mp_restartgame "1" // Restart after one second | Redémarrer après une seconde
echo "[CS2] pracc.cfg loaded / charge"
